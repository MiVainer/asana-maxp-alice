version: '3.8'

services:
  kaiten-telegram-bot:
    build: .
    ports:
      - "5000:5000"
    environment:
      - KAITAN_TOKEN=${KAITAN_TOKEN}
      - BOARD_ID=${BOARD_ID}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3